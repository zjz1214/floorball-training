<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 450" role="img" aria-labelledby="court-title court-desc"><title id="court-title">3v3 场地位置示意</title><desc id="court-desc">横向为长 22 米，纵向为宽 11 米。两端各有球门和守门员区域，中线上有两个任意球点和中点，两侧中轴各有距球门线 5 米的罚球点。为阅读方便，局部尺寸不按比例。</desc><rect x="58" y="65" width="644" height="322" rx="24" fill="#e4f1e9" stroke="#076b61" stroke-width="4"/><path d="M380 65V387" stroke="#fff" stroke-width="3"/><circle cx="380" cy="226" r="6" fill="#076b61"/><circle cx="380" cy="124" r="7" fill="#d48a14"/><circle cx="380" cy="328" r="7" fill="#d48a14"/><rect x="99" y="189" width="45" height="74" fill="#b6d5c4" stroke="#fff" stroke-width="3"/><rect x="616" y="189" width="45" height="74" fill="#b6d5c4" stroke="#fff" stroke-width="3"/><rect x="79" y="202" width="20" height="48" fill="none" stroke="#183035" stroke-width="3"/><rect x="661" y="202" width="20" height="48" fill="none" stroke="#183035" stroke-width="3"/><circle cx="245" cy="226" r="6" fill="#183035"/><circle cx="515" cy="226" r="6" fill="#183035"/><path d="M104 300H243M517 300H656" stroke="#586e73" stroke-width="1.5"/><g font-family="system-ui,Microsoft YaHei,sans-serif" fill="#183035" font-size="15" text-anchor="middle"><text x="380" y="35">场地长度 22 m</text><text x="27" y="226" transform="rotate(-90 27 226)">宽度 11 m</text><text x="420" y="230">中点</text><text x="448" y="120">任意球点</text><text x="448" y="335">任意球点</text><text x="245" y="205">罚球点</text><text x="515" y="205">罚球点</text><text x="176" y="322">距球门线 5 m</text><text x="586" y="322">距球门线 5 m</text><text x="135" y="171">守门员区域</text><text x="625" y="171">守门员区域</text><text x="380" y="420">任意球点：各距相邻长边围板 2 m</text></g></svg>