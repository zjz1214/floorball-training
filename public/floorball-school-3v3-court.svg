<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 540" role="img" aria-labelledby="title desc">
<title id="title">校内 3v3 场地图：24 × 12 米</title><desc id="desc">每队三名场上球员加一名守门员。大禁区深4米宽5米，小禁区深1米宽2.5米。中线两个任意球点各距长边2米，罚球点距球门线5米。</desc>
<rect width="860" height="540" rx="16" fill="#f7faf8"/>
<rect x="70" y="70" width="720" height="360" rx="18" fill="#e4f1e9" stroke="#076b61" stroke-width="4"/>
<path d="M430 70V430" stroke="#076b61" stroke-width="2"/>
<g fill="#b6d5c4" stroke="#076b61" stroke-width="2"><rect x="155.5" y="175" width="120" height="150"/><rect x="584.5" y="175" width="120" height="150"/></g>
<g fill="#e8bd71" stroke="#946314" stroke-width="2"><rect x="175" y="212.5" width="30" height="75"/><rect x="655" y="212.5" width="30" height="75"/></g>
<g fill="none" stroke="#183035" stroke-width="3"><rect x="151" y="226" width="24" height="48"/><rect x="685" y="226" width="24" height="48"/></g>
<g fill="#076b61"><circle cx="430" cy="250" r="5"/><circle cx="430" cy="130" r="6"/><circle cx="430" cy="370" r="6"/></g>
<g fill="#183035"><circle cx="325" cy="250" r="5"/><circle cx="535" cy="250" r="5"/></g>
<g stroke="#586e73" fill="none"><path d="M175 350H325M535 350H685"/><path d="M430 75V122" stroke-dasharray="4 3"/></g>
<g font-family="Microsoft YaHei,system-ui,sans-serif" fill="#183035" font-size="16" text-anchor="middle">
<text x="430" y="34" font-size="22" font-weight="bold">校内 3v3 · 场地 24 × 12 米</text>
<text x="35" y="250" transform="rotate(-90 35 250)">宽 12 m</text>
<text x="215" y="151">大禁区 4 × 5 m</text><text x="645" y="151">大禁区 4 × 5 m</text>
<text x="210" y="310" font-size="12">小禁区 1 × 2.5 m</text><text x="650" y="310" font-size="12">小禁区 1 × 2.5 m</text>
<text x="469" y="104" font-size="14">2 m</text><text x="500" y="135">任意球点</text><text x="490" y="255">中点</text><text x="500" y="376">任意球点</text>
<text x="325" y="228">罚球点</text><text x="535" y="228">罚球点</text>
<text x="250" y="374" font-size="14">距球门线 5 m</text><text x="610" y="374" font-size="14">距球门线 5 m</text>
<text x="430" y="465">绿色：大禁区（守门员权限）　金色：小禁区（守门员保护）</text>
<text x="430" y="495" font-size="14">球门线距端线 3.5 m；禁区边线属于区域内</text>
<text x="430" y="520" font-size="13">位置示意，球门与标记视觉放大；实际划线以规则文字尺寸为准</text>
</g></svg>